name: Publish Kobci Windows preview
on:
  push:
    branches: [publish/kobci-windows-preview-2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kobci-windows-preview-2
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Muhyadiin/Construction-ERP-System' && github.ref == 'refs/heads/publish/kobci-windows-preview-2'
    runs-on: windows-latest
    timeout-minutes: 65
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reuse the exact installer when only its acceptance harness changed
        id: reuse
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: 5efd2ff416230251dc3d3b1f9c2cc0073aa9b5a2
          ARCHIVE_SHA256: 25115b16766500abe4f78ec671459535a471c2a8698679c90deb129450d4ae0f
        run: |
          set -euo pipefail
          if ! git diff --quiet "$SOURCE" "$GITHUB_SHA" -- . ':(exclude)desktop/kobci-windows/check-window.mjs' ':(exclude)desktop/kobci-windows/check-install.ps1' ':(exclude).github/workflows/kobci-windows-preview.yml'; then exit 0; fi
          if ! meta=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14705271532"); then exit 0; fi
          if ! jq -e --arg sha "$SOURCE" --arg digest "sha256:$ARCHIVE_SHA256" '.expired == false and .name == "kobci-windows-candidate" and .workflow_run.id == 44898291406 and .workflow_run.head_sha == $sha and .digest == $digest' <<< "$meta"; then exit 0; fi
          archive="$RUNNER_TEMP/verified-candidate.zip"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14705271532/zip" > "$archive"
          echo "$ARCHIVE_SHA256  $archive" | sha256sum -c -
          cd desktop/kobci-windows
          mkdir release-files
          unzip -q "$archive" -d release-files
          (cd release-files && sha256sum -c SHA256SUMS.txt)
          echo 'used=true' >> "$GITHUB_OUTPUT"
      - name: Fetch the tested server from the build before CAD converters were bundled
        if: steps.reuse.outputs.used != 'true'
        working-directory: desktop/kobci-windows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME: c48ba24de230a3a59f1d490fbd77eb3a016fdbc7
        run: |
          set -euo pipefail
          git diff --exit-code "$RUNTIME" "$GITHUB_SHA" -- ':(top)**' ':(top,exclude)backend/tests/**' ':(top,exclude)desktop/kobci-windows/**' ':(top,exclude)docs/kobci/**' ':(top,exclude).github/workflows/kobci-windows-preview.yml' ':(top,exclude)desktop/src-tauri/Cargo.toml' ':(top,exclude)desktop/src-tauri/src/main.rs'
          metadata=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14614632426")
          echo "$metadata" | jq -e --arg sha "$RUNTIME" '.expired == false and .workflow_run.id == 44702777534 and .workflow_run.head_sha == $sha and .name == ("sidecar-x86_64-pc-windows-msvc-" + $sha + "-1")'
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14614632426/zip" > sidecar.zip
          python prepare.py
      - name: Build the native Kobci window and verify the Microsoft offline WebView2 runtime
        if: steps.reuse.outputs.used != 'true'
        shell: pwsh
        run: ./desktop/kobci-windows/build-desktop.ps1
      - name: Build the per-user installer
        if: steps.reuse.outputs.used != 'true'
        working-directory: desktop/kobci-windows
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'
          if (!(Test-Path $compiler)) {
            choco install nsis --version=3.11 -y --no-progress
            if ($LASTEXITCODE) { throw 'NSIS installation failed' }
          }
          & $compiler /V2 installer.nsi
          if ($LASTEXITCODE) { throw 'NSIS failed' }
      - name: Prepare downloads for acceptance testing
        if: steps.reuse.outputs.used != 'true'
        working-directory: desktop/kobci-windows
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-files
          mv Kobci-Construction-ERP-Windows-x64-Preview-2.exe release-files/
          python -c "from pathlib import Path; import shutil; ui, = Path('payload/server').rglob('_frontend_dist'); assert (ui / 'index.html').is_file(); shutil.make_archive('release-files/Kobci-ERP-web-ui', 'zip', ui)"
          cd release-files
          sha256sum *.exe *.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kobci-windows-candidate
          path: desktop/kobci-windows/release-files/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  acceptance:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: kobci-windows-candidate
          path: desktop/kobci-windows
      - name: Upgrade Preview 1 and open the actual installed desktop
        shell: pwsh
        run: ./desktop/kobci-windows/check-install.ps1

  publish:
    needs: acceptance
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: kobci-windows-candidate
          path: downloads
      - name: Verify the tested bytes and tag their source
        shell: bash
        working-directory: downloads
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: kobci-windows-preview-2
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS.txt
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" > /dev/null
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)" = "$GITHUB_SHA"
      - name: Select the available publisher identity
        id: publisher
        shell: pwsh
        env:
          SIGNING_FIELDS: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT != '' }} ${{ secrets.ARTIFACT_SIGNING_ACCOUNT != '' }} ${{ secrets.ARTIFACT_SIGNING_PROFILE != '' }} ${{ secrets.ARTIFACT_SIGNING_TENANT_ID != '' }} ${{ secrets.ARTIFACT_SIGNING_CLIENT_ID != '' }} ${{ secrets.ARTIFACT_SIGNING_CLIENT_SECRET != '' }}
          REQUIRED: ${{ vars.WINDOWS_SIGNING_REQUIRED }}
        run: |
          $fields = @($env:SIGNING_FIELDS.Split(' ') | Where-Object { $_ -eq 'true' })
          if ($fields.Count -gt 0 -and $fields.Count -lt 6) { throw 'The repository publisher profile is incomplete.' }
          $enabled = $fields.Count -eq 6
          if (!$enabled -and $env:REQUIRED -eq 'true') { throw 'This repository requires a Windows publisher profile.' }
          "enabled=$($enabled.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "Windows publisher profile available: $enabled"
      - name: Sign the tested installer with the configured Microsoft publisher
        if: steps.publisher.outputs.enabled == 'true'
        uses: azure/artifact-signing-action@b443cf8ea4124818d2ea9f043cba29fc3ec47b16
        with:
          azure-tenant-id: ${{ secrets.ARTIFACT_SIGNING_TENANT_ID }}
          azure-client-id: ${{ secrets.ARTIFACT_SIGNING_CLIENT_ID }}
          azure-client-secret: ${{ secrets.ARTIFACT_SIGNING_CLIENT_SECRET }}
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\downloads
          files-folder-filter: exe
      - name: Verify Windows signature and prepare final release notes
        shell: pwsh
        env:
          SIGNED: ${{ steps.publisher.outputs.enabled }}
        run: |
          $installer = Get-Item 'downloads/Kobci-Construction-ERP-Windows-x64-Preview-2.exe'
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($env:SIGNED -eq 'true') {
            if ($signature.Status -ne 'Valid') { throw 'Windows publisher signature did not validate.' }
            $notice = 'Windows verified the Authenticode signature on this installer. Publisher: ' + $signature.SignerCertificate.Subject
          } else {
            if ($signature.Status -ne 'NotSigned') { throw 'Unexpected publisher status on the tested build.' }
            $notice = 'The Kobci setup file has no Windows Authenticode publisher signature. Windows may display Unknown publisher. Keep SmartScreen enabled.'
          }
          $notes = Get-Content -LiteralPath 'desktop/kobci-windows/README.md' -Raw
          $notes.Replace('The release notes report the Windows publisher signature status of the downloadable installer.', $notice) | Set-Content 'release-notes.md' -Encoding utf8
      - name: Sign provenance for the final installer
        id: provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: downloads/Kobci-Construction-ERP-Windows-x64-Preview-2.exe
      - name: Publish tested files and corresponding source
        shell: bash
        working-directory: downloads
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: kobci-windows-preview-2
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE" Kobci-installer.sigstore.json
          sha256sum *.exe *.zip > SHA256SUMS.txt
          gh attestation verify Kobci-Construction-ERP-Windows-x64-Preview-2.exe --repo "$GITHUB_REPOSITORY" --bundle Kobci-installer.sigstore.json
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --prerelease --latest=false --title "Kobci Construction ERP — Windows desktop preview 2" \
            --notes-file ../release-notes.md \
            Kobci-Construction-ERP-Windows-x64-Preview-2.exe Kobci-ERP-web-ui.zip SHA256SUMS.txt Kobci-installer.sigstore.json
